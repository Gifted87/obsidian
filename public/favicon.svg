<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="brainGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brainStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle Border Glow -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.25" />

  <!-- Radial Glow Behind Brain -->
  <circle cx="256" cy="256" r="180" fill="url(#brainGlow)" />

  <!-- Lucide Brain Icon Vector centered and scaled -->
  <g transform="translate(96, 96) scale(13.333)" stroke="url(#brainStroke)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
    <path d="M17.599 6.5a3 3 0 0 0-.399-1.5"/>
    <path d="M6.8 5a3 3 0 0 0-.4 1.5"/>
    <path d="M4.2 11a3 3 0 0 0-.2 1.5"/>
    <path d="M20 12.5a3 3 0 0 0-.2-1.5"/>
    <path d="M12 18v3"/>
    <path d="M12 5V2"/>
  </g>
</svg>
